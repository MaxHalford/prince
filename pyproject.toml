[project]
authors = [
    {name = "Max Halford", email = "maxhalford25@gmail.com"},
]
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "scikit-learn>=1.5.1",
    "pandas>=2.2.0",
    "altair>=5.0.0",
    "narwhals>=2.0.0",
    "typing-extensions>=4.6",
]
name = "prince"
version = "0.23.0"
description = "Factor analysis in Python: PCA, CA, MCA, MFA, FAMD, GPA, PGA"

[project.optional-dependencies]
docs = [
    "nbconvert>=7.16.5",
    "fbpca>=1.0",
    "pytest>=8.3.4",
    "ipykernel>=6.13.0",
    "polars>=1.0.0",
    "xarray>=2025.1.0",
]

[dependency-groups]
dev = [
    "fbpca>=1.0",
    "prek>=0.5.7",
    "ruff>=0.15.4",
    "ty>=0.0.90",
]
test = [
    "prince[docs]",
    "geomstats>=2.8.0",
    "rpy2>=3.5.2",
]

[tool.pytest.ini_options]
addopts = [
    "--verbose",
    "--doctest-modules",
    "--doctest-glob=*.md"
]
doctest_optionflags = "NORMALIZE_WHITESPACE NUMBER ELLIPSIS"

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]  # https://beta.ruff.rs/docs/rules/
lint.ignore = ["E501"]
line-length = 100
target-version = 'py311'

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# ty checks unannotated functions by default. These are the additional rules
# recommended by ty for a strict configuration.
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.ty.src]
include = ["prince"]

[tool.uv]
package = true
