name: CI

on:
  # Allow other workflows (e.g. Publishing) to require these checks.
  workflow_call:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --frozen prek run --all-files

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # ty resolves imports from the installed environment, so the project's
      # dependencies and optional SVD engine must be present. Both are included
      # in the default dev group; the heavier test group requires R and is not needed.
      - run: uv sync --locked
      - run: uv run --frozen ty check

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Ubuntu 24.04's packaged R is sufficient for the reference tests and is
      # much smaller than setup-r's full Debian packaging toolchain.
      R_VERSION: "4.3.3"
    steps:
      - uses: actions/checkout@v6

      - name: Install minimal R
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends r-base-core r-base-dev

      # Keep setup-r's repository and library configuration, but reuse the
      # lightweight Ubuntu installation instead of downloading another R.
      - name: Configure R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          install-r: false

      - uses: ./.github/actions/install-env
        with:
          r-version: ${{ env.R_VERSION }}

      # R is the expensive part of this job. Reuse it for both supported pandas
      # generations, while still running the second suite if the first one fails.
      - name: Test with pandas 2
        id: pandas2
        continue-on-error: true
        run: |
          uv pip install 'pandas<3'
          uv run pytest

      - name: Test with pandas 3
        id: pandas3
        continue-on-error: true
        run: |
          uv pip install 'pandas>=3,<4'
          uv run pytest

      - name: Verify pandas test results
        if: always()
        env:
          PANDAS_2_OUTCOME: ${{ steps.pandas2.outcome }}
          PANDAS_3_OUTCOME: ${{ steps.pandas3.outcome }}
        run: |
          test "$PANDAS_2_OUTCOME" = success
          test "$PANDAS_3_OUTCOME" = success

  notebooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      - run: uv sync --locked --extra docs
      - run: make execute-notebooks
