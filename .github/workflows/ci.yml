name: CI

on:
  # Allow other workflows (e.g. Publishing) to require these checks.
  workflow_call:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --frozen prek run --all-files

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # ty resolves imports from the installed environment, so the project's
      # dependencies and optional SVD engine must be present. Both are included
      # in the default dev group; the heavier test group requires R and is not needed.
      - run: uv sync --locked
      - run: uv run --frozen ty check

  tests:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/r-hub/containers/ubuntu-release:latest
    strategy:
      matrix:
        pandas-version: ["<3", ">=3,<4"]
    name: pandas ${{ matrix.pandas-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-env
      - run: uv pip install 'pandas${{ matrix.pandas-version }}'
      - run: uv run pytest

  notebooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      - run: uv sync --locked --extra docs
      - run: make execute-notebooks
